name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install \
            torch==2.8.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            httpx==0.28.1 \
            pytest==8.4.1 \
            ruff==0.12.4 \
            stable-baselines3==2.7.0
          python - <<'PY'
          import stable_baselines3
          import torch

          assert torch.__version__ == "2.8.0+cpu"
          assert not torch.cuda.is_available()
          assert stable_baselines3.__version__ == "2.7.0"
          PY

      - name: Run Ruff
        run: python -m ruff check backend model scripts tests

      - name: Run Python tests
        run: python -m pytest -q tests

      - name: Verify frozen Hurricane Maria publication
        run: |
          python scripts/hurricane_maria_retrospective.py --verify
          python scripts/hurricane_maria_retrospective.py --replay

      - name: Verify generated evidence publishers
        run: |
          python scripts/generate_frontend_contract.py --check
          python scripts/render_achieved_count_reports.py --check
          python scripts/build_toolbox_presets.py --check
          python -m pytest -q tests/test_combined_distilled_large_failure_evidence.py

  frontend:
    name: Frontend tests, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
